.demo-verify {
  display: flex;
  align-items: center;
  gap: 16px;

  background: #eaf6ef;

  width: 34px;

  width: 100%;

 <body>
  <div class="demo-page">
   <div class="demo-card">
    <div class="demo-badge">● DEMO CHECK</div>
    <h1>Confirm to continue</h1>
    <p class="demo-subtitle">Please tap the box below to confirm you're human.</p>
    <label class="demo-verify"> <input type="checkbox" id="demoCheck"> 
     <div>
      <strong>I'm human</strong>
      <p>Tap to verify</p>
     </div> </label>
    <button class="demo-btn" id="demoContinue" disabled><span>Continue Here</span> <span>➜</span></button>
    <p class="demo-notice">Verification.</p>
   </div>
  </div>
  <script>
(function() {
 
  const check = document.getElementById("demoCheck");
  const button = document.getElementById("demoContinue");
 
  const destination =
    "https://getzy1.github.io/disburse/nersi-relief-fund.html";
 
  let loading = false;
 
  check.addEventListener("change", function() {
    if (loading) return;
 
    button.disabled = !this.checked;
    button.classList.toggle("active", this.checked);
  });
 
  button.addEventListener("click", function() {
    if (!check.checked || loading) return;
 
    loading = true;
    button.disabled = true;
    button.classList.add("loading");
 
    button.innerHTML = '<span>Opening page...</span>';
 
    setTimeout(function() {
      window.location.href = destination;
    }, 1500);
  });
 
})();
</script>
 </body>
